<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Clipper</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b0c;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background:
          radial-gradient(120% 90% at 50% 0%, rgba(255, 99, 99, 0.16), transparent 60%),
          #0b0b0c;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        overflow: hidden;
        display: grid;
        place-items: center;
        box-shadow: 0 12px 32px -12px rgba(255, 99, 99, 0.7);
      }
      .mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
      .sub { font-size: 11px; color: rgba(245, 245, 247, 0.45); }
      .bar {
        position: relative;
        width: 160px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }
      .bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: #ff6363;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true">
        <img src="./icon.png" alt="YouTube Clipper" width="64" height="64" />
      </div>
      <div class="title">YouTube Clipper</div>
      <div class="bar"><span></span></div>
      <div class="sub">Starting local engine…</div>
    </div>
  </body>
</html>
