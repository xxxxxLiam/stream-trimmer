name: Release

# One workflow, end to end: merging to main verifies the code, works out
# whether the change is a patch/minor/major, bumps and tags it, builds the
# installers for all three platforms, and publishes the release publicly.
#
# Manual runs are still available (Actions -> Release -> Run workflow) and can
# force a specific bump instead of the automatic one.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = decide from the commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: "Publish as a pre-release: not marked latest, so auto-update and the download page do not offer it"
        type: boolean
        default: false

permissions:
  contents: write # required to push the commit/tag and publish the release

# Never let two releases run at once — they would race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Nothing gets tagged until the code passes the checks a contributor runs
  # locally. Without this, an auto-release on every merge would happily tag a
  # commit whose installers then fail to build.
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'Release v') &&
       !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  version:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
      level: ${{ steps.detect.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so the range below can be found
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Bump detection lives in scripts/detectBump.cjs, not inline here,
      # because it needs tests. The first inline version read markers out of
      # commit BODIES, so a commit whose body merely documented the markers
      # tripped a major bump and shipped v3.0.0 for a bugfix.
      #
      #   major   [major] in a subject | "BREAKING CHANGE:" footer | type!:
      #   minor   [minor] in a subject | feat: / feat(scope):
      #   patch   anything else
      - id: detect
        run: |
          set -euo pipefail
          BUMP="$(node scripts/detectBump.cjs "${{ github.event.inputs.bump || 'auto' }}")"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}HEAD"
          {
            echo "### Release"
            echo ""
            echo "**Bump:** \`$BUMP\`"
            echo ""
            echo "Commits considered (\`$RANGE\`):"
            echo ""
            git log --no-merges --format='- %s' "$RANGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # No tag is created here. Releases live in the public releases repo, and
      # electron-builder creates the release there — and its tag with it — over
      # the REST API, which is not a git ref push. This repo only needs the
      # version commit.
      #
      # It also cannot create one: a ref-creation rule on this repository
      # rejects `refs/tags/*` with GH013, which is what broke the first v1.0.0
      # attempt after the version commit had already landed.
      - id: bump
        run: |
          set -euo pipefail
          NEW=$(npm version "${{ steps.detect.outputs.bump }}" --no-git-tag-version)
          git commit -aqm "Release $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npx electron-builder --mac dmg --publish always
          - os: windows-latest
            build: npx electron-builder --win nsis --publish always
          - os: ubuntu-latest
            build: npx electron-builder --linux AppImage --publish always
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Build front-end + bundle binaries + server
        env:
          # Public release: the channel-data tool is compiled out. Never set
          # these here; the owner's private build is made locally (see README).
          VITE_ENABLE_CHANNEL_DATA: ""
          VITE_OWNER_MACHINES: ""
          VITE_OWNER_SALT: ""
          # Private source maps for this build (see plans/code-protection-plan.md).
          # They are written next to the bundles but never packaged: build.files
          # excludes every .map, and nothing carries a sourceMappingURL.
          CLIPR_SOURCEMAPS: "1"
        run: npm run build:electron
      # Uploads into a DRAFT release (see build.publish.releaseType in
      # package.json). Draft is deliberate: it keeps a half-finished release
      # — macOS uploaded, Windows still building — from ever being visible.
      # The publish job below flips it public once all three have succeeded.
      - name: Build & upload installer
        env:
          # Installers go to the public xxxxxLiam/clipr repo, not this one, so
          # the source can stay private. GITHUB_TOKEN is scoped to this
          # repository and cannot write there; RELEASES_TOKEN is a
          # fine-grained PAT with Contents: read and write on clipr only.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Public release: the channel-data tool is compiled out. Never set
          # these here; the owner's private build is made locally (see README).
          VITE_ENABLE_CHANNEL_DATA: ""
          VITE_OWNER_MACHINES: ""
          VITE_OWNER_SALT: ""
        run: ${{ matrix.build }}

      # Keep this build's source maps, privately, so a crash stack from the
      # shipped (minified, obfuscated) app can be decoded with
      # `npm run decode-stack -- <version>`. An artifact of this private
      # repository: only people with access to it can download it, and it is
      # never attached to the public release. The obfuscation is randomised
      # per build, so each platform keeps its own maps.
      - name: Collect source maps
        id: maps
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm run collect-sourcemaps
      - name: Keep source maps privately
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ steps.maps.outputs.version }}-${{ runner.os }}
          path: sourcemaps/${{ steps.maps.outputs.version }}
          if-no-files-found: error
          retention-days: 90

  # Runs only if every platform built, so a partial release is never made
  # public. If one platform fails, the draft stays a draft for inspection.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the release
        env:
          # The draft lives in the public releases repo, so both the token and
          # every gh call must target clipr rather than this repository.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_REPO: ${{ vars.RELEASES_REPO || 'xxxxxLiam/clipr' }}
          TAG: ${{ needs.version.outputs.new_version }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          git fetch -q origin main

          # Notes: everything since the previous release. This repo carries no
          # release tags (the tag lives in the releases repo), so the boundary
          # is the previous "Release v..." commit rather than a tag. HEAD is
          # the current one, hence --skip=1.
          PREV="$(git log origin/main --format='%H %s' --skip=1 \
                  | grep -m1 -E '^[0-9a-f]+ Release v' | cut -d' ' -f1 || true)"
          if [ -n "$PREV" ]; then
            NOTES="$(git log --no-merges --format='- %s' "$PREV..origin/main")"
          else
            # First release under this scheme: cap it rather than dumping the
            # project's entire history into the release notes.
            NOTES="$(git log --no-merges --format='- %s' -n 50 origin/main)"
          fi
          [ -n "$NOTES" ] || NOTES="Maintenance release."

          # A pre-release is public to anyone with the link but is not "latest": electron-updater and
          # the download page (releases/latest) keep offering the previous version. Only a manual run
          # can ask for one (the "prerelease" input).
          if [ "${PRERELEASE:-false}" = "true" ]; then
            gh release edit "$TAG" \
              --draft=false \
              --prerelease \
              --latest=false \
              --notes "$NOTES"
          else
            gh release edit "$TAG" \
              --draft=false \
              --latest \
              --notes "$NOTES"
          fi

          echo "Published $TAG (${{ needs.version.outputs.level }})" >> "$GITHUB_STEP_SUMMARY"
          # $GITHUB_REPOSITORY is this (private) source repo; the release
          # itself lives in the public one, so link that instead.
          echo "$GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
